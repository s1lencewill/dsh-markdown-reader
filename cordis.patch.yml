# dsh-markdown-reader bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/dsh-markdown-reader`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (workspace-gated /md-reader/* routes + vendor assets +
# agent announcement), and the `dsh.client` declaration in package.json makes
# the browser half (exports "./client", served at /plugins/ui-dsh-markdown-
# reader/client.js) load in the web GUI.
- insert:
    - id: ui-dsh-markdown-reader
      name: '@linxin666/dsh-markdown-reader'
